[workspace]
members = [
    "crates/kgraph-core",
    "crates/kgraph-subgraphs",
    "crates/kgraph-town",
    "crates/kgraph-cli",
]
resolver = "2"

[workspace.package]
version = "0.3.0"
edition = "2021"

[workspace.dependencies]
axum = "0.7"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.5", features = ["derive", "env"] }
flate2 = { version = "1.0", default-features = false, features = ["zlib-rs"] }
fs2 = "0.4"
futures-util = "0.3"
globset = "0.4"
hex = "0.4"
httparse = "1.9"
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio", "server", "http1"] }
libc = "0.2"
libdeflate-sys = "1.26"
once_cell = "1.20"
png = "0.17"
rand = "0.8"
rayon = "1.10"
regex = "1.11"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
sha2 = { version = "0.10", features = ["asm"] }
subtle = "2.6"
tempfile = "3.14"
thiserror = "2.0"
tokio = { version = "1.42", features = ["full"] }
tokio-stream = "0.1"
tokio-util = "0.7"
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2.5"
urlencoding = "2.1"
zip = { version = "2.2", default-features = false, features = ["deflate"] }

kgraph-core = { path = "crates/kgraph-core" }
kgraph-subgraphs = { path = "crates/kgraph-subgraphs" }
kgraph-town = { path = "crates/kgraph-town" }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = "symbols"
