[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "kgraph-runner"
version = "0.2.0"
description = "A Python runner for verifiable, composable workflows."
readme = "README.md"
requires-python = ">=3.9"

[project.optional-dependencies]
dev = ["ruff>=0.6", "mypy>=1.10"]

[project.scripts]
kgraph-town = "kgraph_runner.cli:main"
kgraph = "kgraph_runner.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
kgraph_runner = ["ui_assets/*"]

[tool.ruff]
target-version = "py39"
line-length = 120
