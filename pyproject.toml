[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "kgraph-runner"
version = "0.1.1"
description = "A Python runner for verifiable, composable workflows."
readme = "README.md"
requires-python = ">=3.9"

[project.scripts]
kgraph-town = "kgraph_runner.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
