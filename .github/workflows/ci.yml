name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install the project
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
      - name: Run Python tests
        run: python -m unittest discover -s tests -v
      - name: Check Town JavaScript
        run: node --check src/kgraph_runner/ui_assets/town.js
      - name: Build and smoke-test the wheel
        run: |
          python -m pip wheel --no-deps -w dist .
          smoke_dir=$(mktemp -d "$RUNNER_TEMP/kgraph-wheel.XXXXXX")
          cd "$smoke_dir"
          unset PYTHONPATH
          python -m venv .venv
          .venv/bin/python -m pip install --no-deps "$GITHUB_WORKSPACE"/dist/*.whl
          .venv/bin/kgraph-town --help
          .venv/bin/kgraph --help
          .venv/bin/python - <<'PY'
          from importlib.resources import files

          from kgraph_runner import GraphRunner, render_town_html

          script = files("kgraph_runner").joinpath("ui_assets").joinpath("town.js").read_text(encoding="utf-8")
          assert callable(GraphRunner)
          assert script.strip() and script in render_town_html({})
          PY

  rust:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run Rust tests
        run: cargo test --workspace
      - name: Check Rust with Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Build release binaries
        run: cargo build --release --workspace
      - name: Smoke-test native binaries
        shell: bash
        run: |
          suffix=""
          if [[ "$RUNNER_OS" == "Windows" ]]; then suffix=".exe"; fi
          "./target/release/kgraph${suffix}" --help
          "./target/release/kgraph-town${suffix}" --help
